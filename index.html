<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Converter</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2d2b42 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }

        .video-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #000;
            aspect-ratio: 4/3;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror the video */
        }

        .recording-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .recording-indicator.active {
            opacity: 1;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .result-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .prediction-display {
            margin: auto 0;
        }

        .prediction-label {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #result {
            font-size: 6rem;
            font-weight: 700;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
            min-height: 140px; 
            line-height: normal;
        }

        .controls {
            width: 100%;
            display: grid;
            gap: 1rem;
        }

        .btn-custom {
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            width: 100%;
        }
        
        .btn-custom:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-start {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(45deg, #cb2d3e, #ef473a);
            color: white;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-stop.active {
            opacity: 1;
            pointer-events: all;
        }

        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(239, 71, 58, 0.4);
            color: white;
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-hands-asl-interpreting me-2"></i> SignToAudio AI
            </a>
            <span class="navbar-text">
                Real-time Gesture Recognition
            </span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container main-container">
        <div class="row w-100 g-5">
            <!-- Video Column -->
            <div class="col-lg-7">
                <div class="video-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <div class="recording-indicator" id="rec-indicator">
                        <div class="recording-dot"></div> LIVE
                    </div>
                </div>
            </div>

            <!-- Controls & Result Column -->
            <div class="col-lg-5">
                <div class="result-panel">
                    <div class="prediction-display">
                        <div class="prediction-label">Detected Gesture</div>
                        <div id="result">--</div>
                    </div>

                    <div class="controls">
                        <button id="startBtn" class="btn btn-custom btn-start" onclick="startPrediction()">
                            <i class="fas fa-play me-2"></i> Start Detection
                        </button>
                        <button id="stopBtn" class="btn btn-custom btn-stop" onclick="stopPrediction()">
                            <i class="fas fa-stop me-2"></i> Stop Detection
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sign Language Converter. All rights reserved.</p>
    </footer>

    <script>
        const video = document.getElementById('video');
        const resultDiv = document.getElementById('result');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recIndicator = document.getElementById('rec-indicator');

        let predictionInterval = null;
        let isPredicting = false;

        // Initialize UI State
        startBtn.disabled = true;

        // Access Webcam on Load
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // Wait for video to be ready
                video.onloadedmetadata = () => {
                    startBtn.disabled = false;
                };
            } catch (err) {
                console.error("Camera access denied:", err);
                resultDiv.innerText = "Cam Error";
                resultDiv.style.fontSize = "2rem";
                startBtn.disabled = true;
            }
        }
        initCamera();

        async function sendFrame() {
            if (!isPredicting) return;
            if (video.videoWidth === 0 || video.videoHeight === 0) return;

            // 1. Capture Frame from Video
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // 2. Convert to Blob
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append("file", blob, "frame.jpg");

                // 3. Send to API
                try {
                    const response = await fetch("http://localhost:8000/predict", {
                        method: "POST",
                        body: formData
                    });
                    
                    if (!response.ok) throw new Error("API Error");

                    const data = await response.json();
                    
                    // 4. Update UI
                    if (data.prediction && data.prediction !== "No Hand Detected") {
                        resultDiv.innerText = data.prediction;
                        
                        // Play Audio if new letter detected
                        if (data.audio) {
                            const audio = new Audio("data:audio/mp3;base64," + data.audio);
                            audio.play().catch(e => console.log("Audio play error:", e));
                        }
                    } else if (data.prediction === "No Hand Detected") {
                         // Optional: Handle no hand logic UI
                    }
                } catch (e) {
                    console.error("API Error or Server Offline:", e);
                }
            }, 'image/jpeg', 0.8); // 0.8 quality for speed
        }

        function startPrediction() {
            if (isPredicting) return;
            
            isPredicting = true;
            
            // UI Updates
            startBtn.classList.add('disabled');
            startBtn.style.opacity = '0.5';
            startBtn.disabled = true; // logic disable
            
            stopBtn.classList.add('active');
            recIndicator.classList.add('active');
            
            resultDiv.innerText = "...";

            // Send a frame every 1 second
            predictionInterval = setInterval(sendFrame, 1000);
        }

        function stopPrediction() {
            if (!isPredicting) return;

            isPredicting = false;
            clearInterval(predictionInterval);

            // UI Updates
            startBtn.classList.remove('disabled');
            startBtn.style.opacity = '1';
            startBtn.disabled = false;
            
            stopBtn.classList.remove('active');
            recIndicator.classList.remove('active');
            
            resultDiv.innerText = "--";
        }
    </script>
</body>
</html>
